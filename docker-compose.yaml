x-block-secrets: &block-secrets
  INFISICAL_CLIENT_ID: ""
  INFISICAL_CLIENT_SECRET: ""
  CODEX_BROKER_CLIENT_ID: ""
  CODEX_BROKER_CLIENT_SECRET: ""
  CODEX_OAUTH: ""
  GOOGLE_CHAT_CREDENTIALS: ""

services:
  pots:
    build: .
    init: true
    restart: unless-stopped
    command: ["node", "/app/scripts/coolify-start.ts"]
    environment:
      <<: *block-secrets
      GOOGLE_CHAT_CREDENTIALS: ${GOOGLE_CHAT_CREDENTIALS:?}
      GOOGLE_CHAT_ENDPOINT_URL: ${GOOGLE_CHAT_ENDPOINT_URL:?}
      GOOGLE_CHAT_BOT_USER_ID: ${GOOGLE_CHAT_BOT_USER_ID:?}
      POTS_CODEX_BROKER_URL: http://codex-broker:8089/
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,codex-broker
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      no_proxy: localhost,127.0.0.1,codex-broker
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - pots-data:/home/node/.pots
    depends_on:
      - codex-broker
      - egress-proxy
    networks:
      - isolated
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g

  codex-broker:
    build: .
    init: true
    restart: unless-stopped
    command: ["node", "/app/scripts/codex-broker.ts"]
    environment:
      <<: *block-secrets
      INFISICAL_URL: http://infisical-relay:8080
      CODEX_PROJECT_ID: ${CODEX_PROJECT_ID:?}
      CODEX_BROKER_CLIENT_ID: ${CODEX_BROKER_CLIENT_ID:?}
      CODEX_BROKER_CLIENT_SECRET: ${CODEX_BROKER_CLIENT_SECRET:?}
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,infisical-relay
      NODE_USE_ENV_PROXY: "1"
    depends_on:
      - infisical-relay
      - egress-proxy
    networks:
      - isolated
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 128
    mem_limit: 256m

  infisical-relay:
    image: node:24-bookworm-slim
    user: node
    restart: unless-stopped
    read_only: true
    environment: *block-secrets
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - isolated
      - infisical
    command:
      - node
      - -e
      - |
        const http = require('node:http');
        http.createServer((req, res) => {
          const upstream = http.request({ hostname: 'infisical', port: 8080, path: req.url, method: req.method, headers: req.headers }, response => {
            res.writeHead(response.statusCode, response.headers);
            response.pipe(res);
          });
          upstream.on('error', () => res.writeHead(502).end());
          req.pipe(upstream);
        }).listen(8080, '0.0.0.0');

  webhook-relay:
    image: node:24-bookworm-slim
    user: node
    restart: unless-stopped
    read_only: true
    environment: *block-secrets
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8088"
    networks:
      - default
      - isolated
    command:
      - node
      - -e
      - |
        const http = require('node:http');
        http.createServer((req, res) => {
          const upstream = http.request({ hostname: 'pots', port: 8088, path: req.url, method: req.method, headers: req.headers }, response => {
            res.writeHead(response.statusCode, response.headers);
            response.pipe(res);
          });
          upstream.on('error', () => res.writeHead(502).end());
          req.pipe(upstream);
        }).listen(8088, '0.0.0.0');

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge
    restart: unless-stopped
    environment:
      <<: *block-secrets
      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$VPS_PUBLIC_IP" in *[!0-9.]*|'') exit 1 ;; esac
        sed "s/__VPS_PUBLIC_IP__/$$VPS_PUBLIC_IP/" /etc/squid/pots.conf > /tmp/pots-squid.conf
        exec squid -N -f /tmp/pots-squid.conf
    volumes:
      - ./deploy/squid.conf:/etc/squid/pots.conf:ro
    networks:
      - default
      - isolated

volumes:
  pots-data:

networks:
  isolated:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  infisical:
    external: true
    name: ${INFISICAL_NETWORK:?}
